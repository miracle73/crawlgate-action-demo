[project]
name = "crawlgate"
version = "0.1.0"
description = "SEO regression gate for CI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "playwright>=1.45",
  "pydantic>=2.7",
  "typer>=0.12",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pillow>=10.3",
]

[project.scripts]
crawlgate = "crawlgate.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
